<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" href="icons/feather.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/feather-180.png" />
    <meta name="apple-mobile-web-app-title" content="Feather" />
    <title>Feather</title>
    <style>
      html, body { margin: 0; height: 100%; background: #000; color: #ccc; font: 13px system-ui, sans-serif; }
      body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; }
      #game { max-width: 100vw; max-height: calc(100vh - 28px); background: #000; }
      #game:fullscreen { max-width: none; max-height: none; width: 100vw; height: 100vh; object-fit: contain; }
      #status { white-space: pre-wrap; min-height: 1.2em; }
      /* Fluid: the canvas is the page; the status bar shows while loading and after errors. */
      body.fluid { overflow: hidden; }
      body.fluid #game { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; max-width: none; max-height: none; touch-action: none; }
      body.fluid #bar { position: fixed; left: 8px; bottom: 6px; z-index: 1; background: rgba(0, 0, 0, 0.6); padding: 2px 6px; }
      body.fluid[data-state="running"] #bar { display: none; }
      #rotate { position: fixed; inset: 0; z-index: 2; display: flex; align-items: center; justify-content: center;
        background: #000; color: #eee; font-size: 20px; text-align: center; padding: 16px; }
      #rotate[hidden] { display: none; }
      #fs-hint { position: fixed; left: 50%; top: 12px; transform: translateX(-50%); z-index: 3; max-width: min(90vw, 520px);
        background: rgba(0, 0, 0, 0.85); color: #eee; font-size: 15px; line-height: 1.4; text-align: center;
        padding: 10px 14px; border-radius: 10px; }
      #fs-hint[hidden] { display: none; }
      a { color: #8af; }
    </style>
    <script type="module" crossorigin src="./assets/play-Dbo36sQ5.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/store-5nzIPZ4Q.js">
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="bar"><span id="status"></span></div>
    <div id="rotate" hidden>Turn your phone sideways to play.</div>
    <div id="fs-hint" role="status" hidden>Safari on iPhone can't play full screen. For the whole screen, tap Share → Add to Home Screen and start Feather from there.</div>
  </body>
</html>
