<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Feather's app icon, in the manner of an iOS 6 icon: a glossy blue square with a white feather. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5fb4f5"/>
      <stop offset="0.55" stop-color="#2a7fd8"/>
      <stop offset="1" stop-color="#1a4f9e"/>
    </linearGradient>
    <linearGradient id="vane" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dce9f7"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.08"/>
    </linearGradient>
    <filter id="shade" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#0b2d63" flood-opacity="0.55"/>
    </filter>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <g filter="url(#shade)">
    <!-- the vane: wider on the left, with split barbs on both edges and loose down near the base -->
    <path fill="url(#vane)" d="M392 82
      C 330 96 268 132 228 186
      L 252 188 L 214 210
      C 196 240 186 270 182 300
      L 206 296 L 178 324
      C 176 344 178 362 184 376
      L 236 352
      C 282 330 322 296 346 262
      L 318 260 L 356 240
      C 376 204 390 160 394 118
      L 372 126 L 394 104 Z"/>
    <path fill="#fff" opacity="0.9" d="M184 376 C 170 372 160 360 158 346 C 168 356 178 362 190 366 Z
      M196 370 C 186 384 180 392 166 398 C 178 386 184 378 190 366 Z"/>
    <!-- the shaft: a gentle curve from the tip to the quill -->
    <path fill="none" stroke="#a9c4e4" stroke-width="6" stroke-linecap="round" d="M386 96 C 320 170 252 270 196 360"/>
    <path fill="none" stroke="#ffffff" stroke-width="11" stroke-linecap="round" d="M196 360 C 176 392 160 414 136 440"/>
  </g>
  <!-- iOS 6's gloss: a bright arc over the top half -->
  <path fill="url(#gloss)" d="M0 0 H512 V214 C 380 262 132 262 0 214 Z"/>
</svg>
